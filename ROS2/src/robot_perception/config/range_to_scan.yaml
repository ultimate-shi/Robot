# 使用方法：由 robot_perception/launch/range_to_scan.launch.py 加载；现场差异请通过 launch 参数覆盖。
range_to_scan:
  ros__parameters:
    target_frame: base_link
    joint_state_topic: /joint_states
    publish_period: 0.03
    angle_increment_deg: 2.5
    range_timeout: 0.35
    range_min: 0.02
    range_max: 4.0
    cmd_vel_topic: /cmd_vel_nav_smoothed
    cmd_vel_timeout: 0.3
    ignore_steering_ultrasonic_on_pure_rotation: true
    rotation_linear_threshold: 0.01
    rotation_angular_threshold: 0.05
