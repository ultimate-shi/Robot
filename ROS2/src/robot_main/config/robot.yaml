# 作用：整车公共默认值；用法：robot.launch.py 加载，实机默认全部使用 Astra Pro RGB-D。
defaults:
  camera_source: astra
  virtual_ply: /workspace/maps/studyroom/studyroom.ply
  log_level: warn
  node_start_interval: 0.8
  sensor_start_delay: 6.0
  control_start_delay: 3.0
  controller_service_timeout: 8.0
  controller_max_attempts: 12
  navigation_start_delay: 14.0
  perception_start_delay: 8.0
  foxglove_port: 8765
  use_imu: true
  use_wheel_odometry: true
  start_semantic_perception: true
