# 使用方法：由 robot_control/launch/chassis_control.launch.py 加载；现场差异请通过 launch 参数覆盖。
chassis_controller:
  ros__parameters:
    wheelbase: 0.312
    track: 0.280
    radius: 0.055
    motion_mode: four_ws
    steering_limit: 1.57
    ackermann_min_turning_speed: 0.04
    publish_odometry: true  # 独立旧控制入口保持兼容；完整双目入口覆盖为 false，由 EKF 独占 /odom
    terrain_check_enabled: true
    cmd_vel_timeout: 0.5  # 上游速度命令超时后发布零轮速，单位 s
    steering_ready_tolerance: 0.08  # 连续两帧转向角进入此范围后允许低速运动，单位 rad
    steering_full_speed_tolerance: 0.05  # 转向误差小于此值时不因舵机精度额外降速，单位 rad
    steering_stop_tolerance: 0.15  # 任一转向误差超过此值立即停车，单位 rad
    steering_ready_samples: 2  # 首次放行需要连续到位的真实关节反馈帧数
    steering_min_speed_scale: 0.75  # 接近停车角度前的最低轮速比例，避免小误差反复停走
    steering_feedback_timeout: 0.4  # 容忍 6Hz 反馈偶发漏一帧；与 SE2 缓存 400ms 超时协同停车

wheel_command_guard:
  ros__parameters:
    input_topic: /wheel_controller/commands_raw
    output_topic: /wheel_controller/commands
    heartbeat_topic: /hardware/command_heartbeat
    command_timeout: 0.5
    publish_rate: 20.0
    max_wheel_command_rad_s: 1.8  # 四轮架空 D100% 稳态最慢轮约 1.878rad/s；统一留余量，单位 rad/s
