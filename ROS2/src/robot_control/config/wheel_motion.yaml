# 使用方法：由 wheel_motion.launch.py 加载，实机优先使用 DMC T 指令。
wheel_motion_server:
  ros__parameters:
    wheel_radius: 0.055
    virtual_speed: 0.10
    distance_tolerance: 0.005
    default_steering_timeout: 5.0
    default_motion_timeout: 30.0
    feedback_timeout: 0.25
    steering_limit: 1.57  # Action 转向目标的最大绝对角度，单位 rad
    require_encoder_service: true  # 实机 T 服务缺失时拒绝动作，禁止改用轮速回退
    require_console_arm: false  # 单独运行保持原行为；整车入口显式设为 true
    console_arm_timeout: 0.5  # 软件停止状态心跳超时后中止定距动作，单位 s
