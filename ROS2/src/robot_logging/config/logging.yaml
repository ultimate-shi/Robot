# 作用：配置日志存储、轮转和两个独立话题策略文件；使用方法：robot_logging/logging.launch.py 读取；迁移 SSD 时只改根目录的挂载点。
logging:
  root: /var/lib/robot-logs
  require_mount: true  # 容器必须看到独立 bind mount，避免误写 Docker 层
  max_total_bytes: 10000000000
  min_free_bytes: 3000000000
  retention_days: 7
  segment_bytes: 268435456
  segment_seconds: 900
  incident_seconds: 10
  incident_max_bytes: 2000000000
  incident_cooldown_seconds: 60
  index_max_message_bytes: 2048
  index_max_bytes: 400000000
  poll_seconds: 2
  recording_topics_file: recording_topics.yaml  # 相对本文件；控制日常录制白名单
  index_topics_file: index_topics.yaml  # 相对本文件；控制索引白名单及去重/采样
  index_max_decode_bytes: 65536  # 入选消息解码上限；大原始数据仅保留 MCAP
  index_retention_days: 7  # 仅清理过期索引，不额外删除 MCAP
