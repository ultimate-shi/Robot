# 使用方法：由 robot_navigation/launch/stereo_odometry.launch.py 加载；现场差异请通过 launch 参数覆盖。
stereo_odometry:
  ros__parameters:
    frame_id: base_link
    odom_frame_id: odom
    publish_tf: true
    wait_for_transform: 1.0  # 实测视觉处理延迟约 0.6~0.9 s，给同时间戳 odom TF 留出到达时间
    wait_imu_to_init: false
    approx_sync: false
    topic_queue_size: 2
    sync_queue_size: 5
    qos: 1
    Odom/Strategy: "0"
    Odom/ResetCountdown: "3"
    OdomF2M/MaxSize: "1000"
    Vis/MinInliers: "15"
    Vis/MaxFeatures: "800"
