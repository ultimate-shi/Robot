# 作用：Astra Pro RGB-D 视觉里程计；用法：rgbd_odometry.launch.py，输出保留原 /visual_odom_raw 接口。
rgbd_odometry:
  ros__parameters:
    frame_id: base_link
    odom_frame_id: odom
    publish_tf: false
    subscribe_rgbd: true
    wait_for_transform: 0.2
    wait_imu_to_init: false
    approx_sync: true
    approx_sync_max_interval: 0.05
    topic_queue_size: 2
    sync_queue_size: 5
    qos: 1
    Odom/Strategy: "0"
    Odom/ResetCountdown: "3"
    OdomF2M/MaxSize: "1000"
    Vis/MinInliers: "15"
    Vis/MaxFeatures: "800"
    Vis/MaxDepth: "4.0"
