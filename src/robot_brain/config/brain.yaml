# 使用方法：由 robot_brain/brain.launch.py 加载；所有大模型和网页参数集中在此文件。
brain_ros_bridge:
  ros__parameters:
    http_host: 0.0.0.0
    http_port: 8080
    inference_url: http://127.0.0.1:9100
    frame_topic: /stereo/right/image_rect/compressed
    chat_queue_size: 8
    chat_timeout: 180.0
    chat_history_turns: 2
    action_scene_refresh_timeout: 5.0
    frame_cache_size: 30
    frame_cache_age_seconds: 3.0
    qwen_log_directory: /workspace/qwen_logs
    lease_grace_seconds: 10.0
    motion_enabled: false
