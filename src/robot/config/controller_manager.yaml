# robot.launch 使用说明：
# 本文件由 robot.launch.py 传给 controller_manager/ros2_control_node。
# 作用是设置 ros2_control 控制管理器自身参数。
# update_rate=10 表示控制管理器按 10Hz 更新控制器。
# use_sim_time=false 表示当前工作区使用系统时间，不使用仿真 /clock。
# 删除风险：controller_manager 没有该配置时，控制器加载和更新频率可能不符合当前调试预期。

# controller_manager.yaml
controller_manager:
  ros__parameters:
    update_rate: 10
    use_sim_time: false