# foxglove3d 使用说明：
# 本文件由 foxglove3d.launch.py 同时传给 chassis_controller_3d、virtual_imu、obstacle_avoidance、
# pointcloud_obstacle_filter 等节点。
# 它集中管理底盘尺寸、地形分析阈值、IMU 噪声、超声波安全距离、cmd_vel 超时和点云过滤参数。
# 删除风险：多个节点会退回默认参数，导致数字孪生模型、避障距离和点云过滤行为不可控。

# Terrain and 3D simulation parameters
# Used by foxglove3d.launch.py

chassis_controller:
  ros__parameters:
    # Original chassis parameters
    wheelbase: 0.4
    track: 0.2
    radius: 0.05
    motion_mode: "crab"

    # Terrain status integration
    terrain_check_enabled: true
    grid_resolution: 0.02            # 2cm grid
    ground_tolerance: 0.05           # 5cm tolerance for ground detection
    ground_to_base_height: 0.15      # Ground to base_link vertical offset

    # Physical constraints
    max_grade_deg: 35.0              # Max traversable slope (degrees)
    step_threshold: 0.03             # Step blocking threshold (3cm)
    dropoff_threshold: 0.05          # Drop-off blocking threshold (5cm)
    look_ahead_distance: 0.10        # Look-ahead distance (10cm)
    look_ahead_samples: 5            # Number of samples along look-ahead

virtual_imu:
  ros__parameters:
    publish_rate: 20.0               # 20Hz IMU output
    orientation_noise_std: 0.0087    # ~0.5 degree (GY25T spec)
    angular_vel_noise_std: 0.005     # rad/s
    linear_accel_noise_std: 0.02     # m/s^2
    gravity: 9.81

obstacle_avoidance:
  ros__parameters:
    front_stop_distance: 0.15        # Stop when front obstacle < 15cm
    front_warn_distance: 0.40        # Decelerate when front obstacle < 40cm
    side_stop_distance: 0.10         # Block turning when side < 10cm
    side_warn_distance: 0.25         # Reduce turn rate when side < 25cm
    terrain_traversability_min: 0.3  # Min traversability to proceed
    update_rate: 20.0                # 20Hz avoidance check
    cmd_vel_timeout: 0.3           # Stop if no new cmd_vel arrives for 300ms

pointcloud_obstacle_filter:
  ros__parameters:
    input_topic: /perception/points
    output_topic: /nav/obstacle_points
    target_frame: map
    robot_base_frame: base_link
    min_obstacle_height: 0.05
    max_obstacle_height: 0.80
    local_radius: 4.0
    voxel_size: 0.05
    max_points: 20000


terrain_analyzer:
  ros__parameters:
    input_topic: /perception/points
    publish_rate: 10.0
    grid_resolution: 0.02
    ground_tolerance: 0.05
    terrain_voxel_size: 0.03
    max_grade_deg: 35.0
    step_threshold: 0.03
    dropoff_threshold: 0.05
    look_ahead_distance: 0.10
    look_ahead_samples: 5
    ground_to_base_height: 0.15
    wheelbase: 0.4
    track: 0.2

virtual_ultrasonic:
  ros__parameters:
    input_topic: /perception/points
    max_range: 4.0
    min_range: 0.02
    fov_half_deg: 15.0
    min_height: 0.03
    max_height: 0.60
    voxel_size: 0.03
    publish_period: 0.2
