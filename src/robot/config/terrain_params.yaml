# robot.launch 使用说明：
# 本文件由 robot.launch.py 同时传给 chassis_controller_node、virtual_imu、obstacle_avoidance、
# pointcloud_obstacle_filter 等节点。
# 它集中管理底盘尺寸、地形分析阈值、IMU 噪声、超声波安全距离、cmd_vel 超时和点云过滤参数。
# 删除风险：多个节点会退回默认参数，导致数字孪生模型、避障距离和点云过滤行为不可控。

# Terrain and 3D simulation parameters
# Used by robot.launch.py

chassis_controller:
  ros__parameters:
    # Original chassis parameters
    # Nav2 默认输出 linear.x + angular.z，four_ws 能响应原地/转向角速度。
    wheelbase: 0.4
    track: 0.2
    radius: 0.05
    motion_mode: "four_ws"
    steering_limit: 1.57              # Match URDF steer joint limit: -90deg to +90deg
    ackermann_min_turning_speed: 0.04  # Small forward speed when Nav2 asks Ackermann to rotate in place

    # Terrain status integration
    terrain_check_enabled: true
    grid_resolution: 0.02            # 2cm grid
    ground_tolerance: 0.05           # 5cm tolerance for ground detection
    ground_to_base_height: 0.15      # Ground to base_link vertical offset

    # Physical constraints
    max_grade_deg: 35.0              # Max traversable slope (degrees)
    step_threshold: 0.03             # Step blocking threshold (3cm)
    dropoff_threshold: 0.05          # Drop-off blocking threshold (5cm)
    look_ahead_distance: 0.10        # Look-ahead distance (10cm)
    look_ahead_samples: 5            # Number of samples along look-ahead

virtual_imu:
  ros__parameters:
    publish_rate: 20.0               # 20Hz IMU output
    orientation_noise_std: 0.0087    # ~0.5 degree (GY25T spec)
    angular_vel_noise_std: 0.005     # rad/s
    linear_accel_noise_std: 0.02     # m/s^2
    gravity: 9.81

obstacle_avoidance:
  ros__parameters:
    front_stop_distance: 0.15        # Stop when front obstacle < 15cm
    front_warn_distance: 0.40        # Decelerate when front obstacle < 40cm
    side_stop_distance: 0.10         # Block turning when side < 10cm
    side_warn_distance: 0.25         # Reduce turn rate when side < 25cm
    terrain_traversability_min: 0.3  # Min traversability to proceed
    update_rate: 20.0                # 20Hz avoidance check
    cmd_vel_timeout: 0.3           # Stop if no new cmd_vel arrives for 300ms

reverse_node:
  ros__parameters:
    reverse_distance: 0.8          # 每次自动原路回退的目标距离，单位 m
    reverse_speed: -0.06           # 回退线速度，负值表示倒车，单位 m/s
    max_angular_speed: 0.35        # 回退时最大角速度，单位 rad/s
    history_distance: 5.0          # 最多保留最近 5m 轨迹用于原路回退
    history_timeout: 60.0          # 最多保留最近 60s 轨迹
    sample_distance: 0.03          # /odom 轨迹抽样间隔，单位 m
    rear_stop_distance: 0.15       # 后向超声波小于该距离时立即停止回退
    safe_ultrasonic_distance: 0.25 # 后向障碍进入该距离后主动降低回退速度
    control_rate: 20.0             # 回退控制频率，单位 Hz
    lookahead_distance: 0.12       # 沿历史轨迹反向跟踪的前瞻距离，单位 m
    angular_gain: 1.6             # 倒车沿历史轨迹修正方向的角速度增益

nav_controller_node:
  ros__parameters:
    update_rate: 20.0              # 速度仲裁循环频率，单位 Hz
    stuck_timeout: 2.5             # Nav2 有速度但该时间内位移不足则判定卡住
    stuck_distance: 0.03           # stuck_timeout 内最小期望位移，单位 m
    nav_cmd_active_threshold: 0.02 # 判断 /cmd_vel_nav 为运动命令的阈值
    safe_cmd_zero_threshold: 0.01  # 判断 /cmd_vel_safe 接近 0 的阈值
    safe_block_timeout: 1.5        # 安全层持续拦停达到该时间后触发回退
    cmd_vel_timeout: 0.5           # 上游速度命令超时时间，单位 s
    reverse_distance: 0.8          # 请求 reverse_node 回退的距离，单位 m
    max_recovery_attempts: 3       # 同一目标最多自动回退 3 次，第 4 次卡住取消目标
    goal_idle_reset_time: 3.0      # Nav2 停止输出后清零恢复次数的空闲时间
    reverse_retry_cooldown: 3.0    # 回退失败后暂停自动再次请求回退的时间，避免反复发布零速度


pointcloud_obstacle_filter:
  ros__parameters:
    input_topic: /perception/points
    output_topic: /nav/obstacle_points
    target_frame: map
    robot_base_frame: base_link
    min_obstacle_height: 0.05
    max_obstacle_height: 0.80
    local_radius: 4.0
    voxel_size: 0.05
    max_points: 20000


terrain_analyzer:
  ros__parameters:
    input_topic: /perception/points
    publish_rate: 10.0
    grid_resolution: 0.02
    ground_tolerance: 0.05
    terrain_voxel_size: 0.03
    max_grade_deg: 35.0
    step_threshold: 0.03
    dropoff_threshold: 0.05
    look_ahead_distance: 0.10
    look_ahead_samples: 5
    ground_to_base_height: 0.15
    wheelbase: 0.4
    track: 0.2

virtual_ultrasonic:
  ros__parameters:
    input_topic: /perception/points
    max_range: 4.0
    min_range: 0.02
    fov_half_deg: 15.0
    min_height: 0.03
    max_height: 0.60
    voxel_size: 0.03
    publish_period: 0.2
