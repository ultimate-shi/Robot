# robot.launch 使用说明：
# 本文件由 robot.launch.py 传给底盘、IMU、安全避障、点云过滤、地形分析、虚拟超声波、
# range_to_scan 和 nav_controller_node。
# 它只保留运行时确实需要外部调整的底盘尺寸/模式、地形阈值、点云过滤、超声波安全距离和速度超时。

chassis_controller:
  ros__parameters:
    wheelbase: 0.4  # 前后轮轴距，单位 m
    track: 0.2  # 左右轮距，单位 m
    radius: 0.05  # 车轮半径，单位 m
    motion_mode: "four_ws"  # 底盘运动模式，four_ws 表示四轮转向
    steering_limit: 1.57  # 转向关节最大角度限制，单位 rad
    ackermann_min_turning_speed: 0.04  # 阿克曼模式原地转向时使用的最小前进速度，单位 m/s
    terrain_check_enabled: true  # 是否启用地形可通行性检查
    grid_resolution: 0.02  # 地形栅格分辨率，单位 m
    ground_tolerance: 0.05  # 地面高度识别容差，单位 m
    ground_to_base_height: 0.15  # 地面到 base_link 的垂直偏移，单位 m
    max_grade_deg: 35.0  # 最大可通行坡度，单位 deg
    step_threshold: 0.03  # 台阶障碍判定高度阈值，单位 m
    dropoff_threshold: 0.05  # 跌落边缘判定高度阈值，单位 m
    look_ahead_distance: 0.10  # 前向地形检测距离，单位 m
    look_ahead_samples: 5  # 前向地形检测采样点数量

virtual_imu:
  ros__parameters:
    publish_rate: 20.0  # 消息发布频率，单位 Hz
    orientation_noise_std: 0.0087  # IMU 姿态噪声标准差，单位 rad
    angular_vel_noise_std: 0.005  # IMU 角速度噪声标准差，单位 rad/s
    linear_accel_noise_std: 0.02  # IMU 线加速度噪声标准差，单位 m/s^2
    gravity: 9.81  # 重力加速度，单位 m/s^2

obstacle_avoidance:
  ros__parameters:
    front_stop_distance: 0.10  # 前方/后方障碍小于该距离时停止，单位 m
    front_warn_distance: 0.20  # 前方/后方障碍小于该距离时减速，单位 m
    side_stop_distance: 0.10  # 侧向障碍小于该距离时限制横移或转向，单位 m
    side_warn_distance: 0.20  # 侧向障碍小于该距离时降低横移或转向速度，单位 m
    terrain_traversability_min: 0.20  # 允许继续行驶的最小地形可通行性评分
    update_rate: 20.0  # 控制或检测循环更新频率，单位 Hz
    cmd_vel_timeout: 0.3  # 速度命令超时时间，单位 s

nav_controller_node:
  ros__parameters:
    update_rate: 20.0  # 速度门控循环频率，单位 Hz
    cmd_vel_timeout: 0.5  # /cmd_vel_nav_smoothed 超时后输出零速，单位 s
    require_active_nav_goal: false  # 默认不依赖 action status 持续放行，避免 DDS status 丢失时误断速
    nav_goal_status_timeout: 3.0  # Nav2 action 状态超时后切断遗留速度，单位 s
    nav_cmd_active_threshold: 0.02  # 判断 /cmd_vel_nav_smoothed 为运动命令的速度阈值

pointcloud_obstacle_filter:
  ros__parameters:
    input_topic: /perception/points  # 输入点云话题名称
    output_topic: /nav/obstacle_points  # 输出点云话题名称
    target_frame: map  # 点云过滤后使用的目标坐标系
    robot_base_frame: base_link  # 机器人底盘坐标系名称
    min_obstacle_height: 0.00  # 障碍物最小高度过滤阈值，单位 m
    max_obstacle_height: 0.80  # 障碍物最大高度过滤阈值，单位 m
    local_radius: 4.0  # 保留机器人周围局部点云的半径，单位 m
    voxel_size: 0.05  # 点云体素降采样尺寸，单位 m
    max_points: 20000  # 点云过滤后最多发布的点数

terrain_analyzer:
  ros__parameters:
    input_topic: /perception/points  # 输入点云话题名称
    publish_rate: 10.0  # 消息发布频率，单位 Hz
    grid_resolution: 0.02  # 地形栅格分辨率，单位 m
    ground_tolerance: 0.05  # 地面高度识别容差，单位 m
    terrain_voxel_size: 0.03  # 地形分析点云体素尺寸，单位 m
    max_grade_deg: 35.0  # 最大可通行坡度，单位 deg
    step_threshold: 0.03  # 台阶障碍判定高度阈值，单位 m
    dropoff_threshold: 0.05  # 跌落边缘判定高度阈值，单位 m
    look_ahead_distance: 0.10  # 前向地形检测距离，单位 m
    look_ahead_samples: 5  # 前向地形检测采样点数量
    ground_to_base_height: 0.15  # 地面到 base_link 的垂直偏移，单位 m
    wheelbase: 0.4  # 前后轮轴距，单位 m
    track: 0.2  # 左右轮距，单位 m

virtual_ultrasonic:
  ros__parameters:
    input_topic: /perception/points  # 输入点云话题名称
    max_range: 4.0  # 虚拟超声波最大测距范围，单位 m
    min_range: 0.02  # 虚拟超声波最小有效测距范围，单位 m
    fov_half_deg: 15.0  # 虚拟超声波半视场角，单位 deg
    min_height: 0.03  # 参与测距的点云最小高度，单位 m
    max_height: 0.80  # 参与测距的点云最大高度，单位 m
    voxel_size: 0.03  # 点云体素降采样尺寸，单位 m
    publish_period: 0.05  # 虚拟超声波发布周期，单位 s

range_to_scan:
  ros__parameters:
    target_frame: base_link  # /scan 输出使用的目标坐标系
    joint_state_topic: /joint_states  # 读取四个转向关节角的关节状态话题
    publish_period: 0.05  # /scan 发布周期，单位 s
    angle_increment_deg: 5.0  # /scan 角度分辨率，单位 deg
    range_timeout: 0.25  # 超声波数据超过该时间后不再写入 /scan，单位 s
    range_min: 0.02  # /scan 最小有效距离，单位 m
    range_max: 4.0  # /scan 最大有效距离，单位 m
    stamp_backdate: 0.05  # /scan 时间戳回退量，避免 TF 查询到未来，单位 s
    cmd_vel_topic: /cmd_vel_nav_smoothed  # 读取 Nav2 平滑速度，仅用于调试可视化时判断纯旋转
    cmd_vel_timeout: 0.3  # 速度命令缓存超时时间，单位 s
    ignore_steering_ultrasonic_on_pure_rotation: true  # 纯原地旋转时 /scan 屏蔽随轮转向的前/后超声波
    rotation_linear_threshold: 0.01  # 判定纯旋转时允许的最大线速度绝对值，单位 m/s
    rotation_angular_threshold: 0.05  # 判定纯旋转时所需的最小角速度绝对值，单位 rad/s
