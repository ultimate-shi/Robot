# 机器人本地大脑、语义感知、多用户租约和验收采集参数。
semantic_perception:
  ros__parameters:
    image_topic: /stereo/left/image_rect
    depth_topic: /stereo/depth/image
    camera_info_topic: /stereo/left/camera_info
    output_topic: /perception/semantic_detections
    inference_url: http://127.0.0.1:9100/v1/detect
    map_frame: map
    max_inference_rate: 5.0
    request_timeout: 2.0
    jpeg_quality: 80
    min_confidence: 0.35
    depth_center_ratio: 0.4
    min_valid_depth_pixels: 12
    track_match_distance: 0.5
    track_timeout: 3.0

brain_mission:
  ros__parameters:
    motion_enabled: false  # 首版强制只预演，不能向真实底盘发送速度
    request_topic: /brain/mission_request
    detections_topic: /perception/semantic_detections
    map_topic: /map
    map_frame: map
    base_frame: base_link
    planner_service: /compute_path_to_pose
    surface_clearance: 0.5  # 机器人外轮廓到物体可见表面的最终距离
    robot_radius: 0.25
    follow_distance: 1.2
    follow_update_distance: 0.4
    person_lost_timeout: 2.0
    frontier_min_cells: 8

brain_web:
  ros__parameters:
    http_host: 0.0.0.0  # 局域网完全开放，不启用登录或 HTTPS
    http_port: 8080
    inference_url: http://127.0.0.1:9100
    chat_queue_size: 8
    lease_grace_seconds: 10.0
    motion_enabled: false

acceptance_sampler:
  ros__parameters:
    output_directory: /workspace/acceptance_dataset
    image_topic: /stereo/left/image_rect
    depth_topic: /stereo/depth/image
    camera_info_topic: /stereo/left/camera_info
    detections_topic: /perception/semantic_detections
    map_frame: map
    base_frame: base_link
    jpeg_quality: 95
