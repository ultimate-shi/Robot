# robot.launch 使用说明：
# 本文件由 robot.launch.py IncludeLaunchDescription(nav2_bringup/navigation_launch.py) 传入 Nav2。
# global_costmap 使用 /map 静态 2D 地图做全局规划。
# local_costmap 使用 VoxelLayer 订阅 /nav/obstacle_points 点云做局部避障。
# /nav/obstacle_points 来自 pointcloud_obstacle_filter，是仿真 PLY 或现实双目点云的统一障碍物接口。
# 删除风险：Nav2 会缺少代价地图配置，路径规划和局部避障无法按当前架构运行。

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4.0
      height: 4.0
      resolution: 0.05
      plugins:
        - voxel_layer
        - inflation_layer

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 0.80
        mark_threshold: 0
        observation_sources: obstacle_points

        obstacle_points:
          topic: /nav/obstacle_points
          data_type: "PointCloud2"
          marking: true
          clearing: true
          obstacle_max_range: 3.0
          raytrace_max_range: 4.0
          min_obstacle_height: 0.05
          max_obstacle_height: 0.80

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.3

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      plugins:
        - static_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.3
