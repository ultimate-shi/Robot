# robot.launch 使用说明：
# 本文件由 robot.launch.py 传给本项目显式启动的 Nav2 节点。
# 当前只启动 controller_server、planner_server、smoother_server、behavior_server、bt_navigator、
# waypoint_follower、velocity_smoother 和 lifecycle_manager_navigation。
# 不再配置 collision_monitor、route_server、docking_server；超声波只作为底盘前的最后安全过滤层。

bt_navigator:
  ros__parameters:
    global_frame: map  # 全局坐标系名称
    robot_base_frame: base_link  # 机器人底盘坐标系名称
    odom_topic: /odom  # 里程计话题名称
    bt_loop_duration: 10  # 行为树循环周期，单位 ms
    default_server_timeout: 10  # 默认服务等待超时时间，单位 s
    wait_for_service_timeout: 1000  # 等待服务可用的超时时间，单位 ms
    action_server_result_timeout: 900.0  # Action 结果等待超时时间，单位 s
    navigators: ["navigate_to_pose", "navigate_through_poses"]  # 启用的导航器插件名称列表
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"  # 单目标导航器插件
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"  # 多目标导航器插件
    error_code_names:  # 行为树错误码字段名称列表
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 10.0  # 控制器运行频率，单位 Hz
    costmap_update_timeout: 0.30  # 等待代价地图更新的超时时间，单位 s
    min_x_velocity_threshold: 0.001  # x 方向速度低于该值时视为 0，单位 m/s
    min_y_velocity_threshold: 0.001  # y 方向速度低于该值时视为 0，单位 m/s
    min_theta_velocity_threshold: 0.001  # 角速度低于该值时视为 0，单位 rad/s
    failure_tolerance: 0.3  # 控制失败允许持续时间，单位 s
    progress_checker_plugins: ["progress_checker"]  # 进展检查器插件名称列表
    goal_checker_plugins: ["general_goal_checker"]  # 目标检查器插件名称列表
    controller_plugins: ["FollowPath"]  # 路径跟踪控制器插件名称列表
    use_realtime_priority: false  # 是否为控制器使用实时线程优先级

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"  # 进展检查器插件类型
      required_movement_radius: 0.10  # 进展检查所需最小移动距离，单位 m
      movement_time_allowance: 20.0  # 允许未达到进展要求的最长时间，单位 s

    general_goal_checker:
      stateful: true  # 目标检查器是否保持状态
      plugin: "nav2_controller::SimpleGoalChecker"  # 目标检查器插件类型
      xy_goal_tolerance: 0.10  # 目标 xy 位置容差，单位 m
      yaw_goal_tolerance: 0.25  # 目标朝向容差，单位 rad

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"  # 路径跟踪插件类型
      desired_linear_vel: 0.12  # 期望线速度，单位 m/s
      lookahead_dist: 0.35  # 纯跟踪前瞻距离，单位 m
      min_lookahead_dist: 0.15  # 速度缩放前瞻的最小距离，单位 m
      max_lookahead_dist: 0.60  # 速度缩放前瞻的最大距离，单位 m
      lookahead_time: 1.5  # 速度缩放前瞻时间，单位 s
      rotate_to_heading_angular_vel: 0.25  # 原地调整朝向角速度，单位 rad/s
      transform_tolerance: 0.2  # TF 查询容差，单位 s
      use_velocity_scaled_lookahead_dist: false  # 是否按速度缩放前瞻距离
      min_approach_linear_velocity: 0.03  # 靠近目标时的最小线速度，单位 m/s
      approach_velocity_scaling_dist: 0.30  # 开始靠近目标降速的距离，单位 m
      use_collision_detection: false  # RPP 内部碰撞检测关闭，障碍由 costmap 和底盘安全层处理
      use_regulated_linear_velocity_scaling: true  # 是否启用曲率约束线速度缩放
      use_cost_regulated_linear_velocity_scaling: false  # 是否启用代价约束线速度缩放
      regulated_linear_scaling_min_radius: 0.20  # 线速度缩放允许的最小转弯半径，单位 m
      regulated_linear_scaling_min_speed: 0.03  # 线速度缩放后的最小速度，单位 m/s
      use_rotate_to_heading: true  # 是否启用先转向目标朝向的行为
      allow_reversing: false  # 路径跟踪时是否允许倒车
      rotate_to_heading_min_angle: 0.785  # 触发原地转向的最小角度误差，单位 rad
      max_angular_accel: 0.8  # 最大角加速度，单位 rad/s^2
      max_robot_pose_search_dist: 2.0  # 路径上搜索机器人位姿的最大距离，单位 m
      use_interpolation: true  # 是否对路径点进行插值

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0  # 代价地图更新频率，单位 Hz
      publish_frequency: 10.0  # 局部代价地图发布频率，单位 Hz
      global_frame: odom  # 局部代价地图坐标系
      robot_base_frame: base_link  # 机器人底盘坐标系名称
      rolling_window: true  # 是否使用随机器人移动的局部滚动窗口
      width: 4  # 局部代价地图宽度，单位 m
      height: 4  # 局部代价地图高度，单位 m
      resolution: 0.05  # 代价地图栅格分辨率，单位 m
      robot_radius: 0.25  # 机器人圆形足迹半径，单位 m
      plugins: ["voxel_layer", "inflation_layer"]  # 局部代价地图层插件列表
      always_send_full_costmap: true  # 是否每次发布完整代价地图

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"  # 点云障碍层插件类型
        enabled: true  # 是否启用点云障碍层
        publish_voxel_map: true  # 是否发布体素地图用于调试
        origin_z: 0.0  # 体素层 z 方向原点，单位 m
        z_resolution: 0.05  # 体素层 z 方向分辨率，单位 m
        z_voxels: 16  # 体素层 z 方向体素数量
        max_obstacle_height: 0.80  # 障碍物最大高度过滤阈值，单位 m
        mark_threshold: 0  # 体素标记为占用的最小命中阈值
        observation_sources: obstacle_points  # 代价地图观测源名称列表

        obstacle_points:
          topic: /nav/obstacle_points  # 点云障碍输入话题
          data_type: "PointCloud2"  # 观测数据消息类型
          marking: true  # 是否用该观测源标记障碍
          clearing: true  # 是否用该观测源清除障碍
          obstacle_max_range: 3.0  # 障碍标记最大距离，单位 m
          obstacle_min_range: 0.0  # 障碍标记最小距离，单位 m
          raytrace_max_range: 4.0  # 射线清除最大距离，单位 m
          raytrace_min_range: 0.0  # 射线清除最小距离，单位 m
          min_obstacle_height: 0.05  # 障碍物最小高度过滤阈值，单位 m
          max_obstacle_height: 0.80  # 障碍物最大高度过滤阈值，单位 m

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"  # 膨胀层插件类型
        cost_scaling_factor: 3.0  # 膨胀层代价衰减系数
        inflation_radius: 0.1  # 障碍物膨胀半径，单位 m

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0  # 代价地图更新频率，单位 Hz
      publish_frequency: 1.0  # 全局代价地图发布频率，单位 Hz
      global_frame: map  # 全局坐标系名称
      robot_base_frame: base_link  # 机器人底盘坐标系名称
      robot_radius: 0.25  # 机器人圆形足迹半径，单位 m
      resolution: 0.05  # 代价地图栅格分辨率，单位 m
      track_unknown_space: true  # 全局代价地图是否保留未知区域
      plugins: ["static_layer", "inflation_layer"]  # 全局代价地图层插件列表
      always_send_full_costmap: true  # 是否每次发布完整代价地图

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"  # 静态地图层插件类型
        map_subscribe_transient_local: true  # 订阅静态地图时是否使用 transient local QoS

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"  # 膨胀层插件类型
        cost_scaling_factor: 3.0  # 膨胀层代价衰减系数
        inflation_radius: 0.1  # 障碍物膨胀半径，单位 m

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]  # 路径平滑器插件名称列表
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"  # 路径平滑器插件类型
      tolerance: 1.0e-10  # 路径平滑容差
      max_its: 1000  # 路径平滑最大迭代次数
      do_refinement: true  # 是否执行路径平滑细化

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0  # 期望全局规划频率，单位 Hz
    planner_plugins: ["GridBased"]  # 全局规划器插件名称列表
    costmap_update_timeout: 1.0  # 等待代价地图更新的超时时间，单位 s
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"  # 全局规划器插件类型
      tolerance: 0.5  # 规划目标容差，单位 m
      use_astar: false  # NavFn 是否使用 A* 搜索
      allow_unknown: true  # 全局规划是否允许经过未知区域

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw  # 行为服务器订阅的局部代价地图话题
    global_costmap_topic: global_costmap/costmap_raw  # 行为服务器订阅的全局代价地图话题
    local_footprint_topic: local_costmap/published_footprint  # 行为服务器订阅的局部足迹话题
    global_footprint_topic: global_costmap/published_footprint  # 行为服务器订阅的全局足迹话题
    cycle_frequency: 10.0  # 行为服务器循环频率，单位 Hz
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]  # 保留 Nav2 自身恢复行为
    spin:
      plugin: "nav2_behaviors::Spin"  # 原地旋转恢复插件
    backup:
      plugin: "nav2_behaviors::BackUp"  # Nav2 自身后退恢复插件
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"  # 定向行驶恢复插件
    wait:
      plugin: "nav2_behaviors::Wait"  # 等待恢复插件
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"  # 辅助遥控恢复插件
    local_frame: odom  # 局部坐标系名称
    global_frame: map  # 全局坐标系名称
    robot_base_frame: base_link  # 机器人底盘坐标系名称
    transform_tolerance: 0.1  # TF 查询容差，单位 s
    simulate_ahead_time: 2.0  # 恢复行为前向仿真时间，单位 s
    max_rotational_vel: 0.5  # 最大旋转角速度，单位 rad/s
    min_rotational_vel: 0.1  # 最小旋转角速度，单位 rad/s
    rotational_acc_lim: 1.2  # 旋转角加速度限制，单位 rad/s^2

waypoint_follower:
  ros__parameters:
    loop_rate: 20  # waypoint_follower 主循环频率，单位 Hz
    stop_on_failure: false  # 航点执行失败时是否停止任务
    action_server_result_timeout: 900.0  # Action 结果等待超时时间，单位 s
    waypoint_task_executor_plugin: "wait_at_waypoint"  # 航点任务执行器插件名称
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"  # 航点等待插件类型
      enabled: true  # 是否启用航点等待
      waypoint_pause_duration: 200  # 到达航点后的等待时间，单位 ms

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 10.0  # 速度平滑器运行频率，单位 Hz
    stamp_smoothed_velocity_with_smoothing_time: false  # 是否使用平滑时间戳标记速度消息
    scale_velocities: false  # 是否按比例缩放速度向量
    feedback: "OPEN_LOOP"  # 速度平滑反馈模式
    max_velocity: [0.18, 0.0, 0.5]  # 速度上限 [x, y, yaw]
    min_velocity: [-0.08, 0.0, -0.5]  # 速度下限 [x, y, yaw]
    max_accel: [0.4, 0.0, 0.8]  # 加速度上限 [x, y, yaw]
    max_decel: [-0.4, 0.0, -0.8]  # 减速度下限 [x, y, yaw]
    odom_topic: /odom  # 里程计话题名称
    odom_duration: 0.1  # 速度平滑器使用的里程计缓存时间，单位 s
    deadband_velocity: [0.0, 0.0, 0.0]  # 速度死区 [x, y, yaw]
    velocity_timeout: 1.0  # 速度平滑器输入速度超时时间，单位 s
