# 使用方法：由所属 Package 的 launch 或节点加载，请通过参数覆盖现场配置。
# 纯双目建图默认参数。当前 IMU 未接入，所有高影响参数均可在现场继续调优。
stereo_odometry:
  ros__parameters:
    frame_id: base_link
    odom_frame_id: odom
    publish_tf: true
    wait_for_transform: 0.2
    wait_imu_to_init: false
    approx_sync: false
    topic_queue_size: 2
    sync_queue_size: 5
    qos: 1
    Odom/Strategy: "0"
    Odom/ResetCountdown: "3"
    OdomF2M/MaxSize: "1000"
    Vis/MinInliers: "15"
    Vis/MaxFeatures: "800"

rtabmap:
  ros__parameters:
    frame_id: base_link
    odom_frame_id: odom
    map_frame_id: map
    publish_tf: true
    subscribe_stereo: true
    subscribe_depth: false
    subscribe_rgb: false
    subscribe_odom_info: true
    approx_sync: false
    topic_queue_size: 2
    sync_queue_size: 10
    qos: 1
    database_path: /tmp/robot_rtabmap_mapping.db
    Rtabmap/DetectionRate: "1.0"
    Mem/IncrementalMemory: "true"
    Mem/InitWMWithAllNodes: "false"
    RGBD/CreateOccupancyGrid: "true"
    Reg/Force3DoF: "true"
    Grid/FromDepth: "true"
    Grid/3D: "false"
    Grid/RayTracing: "true"
    Grid/CellSize: "0.05"
    Grid/RangeMax: "4.0"
    Grid/MaxObstacleHeight: "0.80"
    Grid/MinGroundHeight: "-0.20"
    Grid/MaxGroundHeight: "0.05"

mapping_snapshot_manager:
  ros__parameters:
    map_topic: /map
    cloud_topic: /mapping/cloud_map
    preview_directory: /tmp/robot_preview
    save_directory: /workspace/maps
    snapshot_basename: current
    snapshot_timezone: Asia/Shanghai  # 长期快照目录名和元数据统一使用北京时间
