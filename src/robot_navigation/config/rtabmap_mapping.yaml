# 使用方法：由 robot_navigation/launch/rtabmap_mapping.launch.py 加载；现场差异请通过 launch 参数覆盖。
rtabmap:
  ros__parameters:
    frame_id: base_link
    odom_frame_id: odom
    map_frame_id: map
    publish_tf: true
    wait_for_transform: 1.0  # 等待视觉里程计发布对应图像时间戳的 odom -> base_link
    subscribe_stereo: true
    subscribe_depth: false
    subscribe_rgb: false
    subscribe_odom_info: false
    subscribe_scan_cloud: false
    approx_sync: false
    topic_queue_size: 2
    sync_queue_size: 10
    qos: 1
    database_path: /tmp/robot_rtabmap_mapping.db
    Rtabmap/DetectionRate: "2.0"
    Mem/IncrementalMemory: "true"
    Mem/InitWMWithAllNodes: "false"
    RGBD/CreateOccupancyGrid: "true"
    Reg/Force3DoF: "true"
    Grid/FromDepth: "true"
    Grid/3D: "false"
    Grid/RayTracing: "true"
    Grid/CellSize: "0.03"
    Grid/RangeMin: "0.25"
    Grid/RangeMax: "4.0"
    Grid/NoiseFilteringRadius: "0.08"
    Grid/NoiseFilteringMinNeighbors: "5"
    Grid/MaxObstacleHeight: "0.80"
    Grid/MinGroundHeight: "-0.20"
    Grid/MaxGroundHeight: "0.05"
