# 使用方法：由 robot_perception/launch/virtual_ultrasonic.launch.py 加载；现场差异请通过 launch 参数覆盖。
virtual_ultrasonic:
  ros__parameters:
    input_topic: /perception/points
    max_range: 4.0
    min_range: 0.02
    fov_half_deg: 15.0
    min_height: 0.03
    max_height: 0.8
    voxel_size: 0.03
    publish_period: 0.03
