# 使用方法：由 robot_perception/launch/pointcloud_obstacle.launch.py 加载；现场差异请通过 launch 参数覆盖。
pointcloud_obstacle_filter:
  ros__parameters:
    input_topic: /perception/points
    output_topic: /nav/obstacle_points
    target_frame: map
    robot_base_frame: base_link
    min_obstacle_height: 0.0
    max_obstacle_height: 0.8
    local_radius: 4.0
    voxel_size: 0.05
    max_points: 20000
