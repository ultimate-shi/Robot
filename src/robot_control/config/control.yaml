# 使用方法：由 robot_control 独立功能或组合 launch 加载，仅包含底盘与安全参数。
chassis_controller:
  ros__parameters:
    wheelbase: 0.4
    track: 0.2
    radius: 0.05
    motion_mode: four_ws
    steering_limit: 1.57
    ackermann_min_turning_speed: 0.04
    publish_odometry: true  # 独立旧控制入口保持兼容；完整双目入口覆盖为 false，由 EKF 独占 /odom
    terrain_check_enabled: true

obstacle_avoidance:
  ros__parameters:
    front_stop_distance: 0.18
    front_warn_distance: 0.35
    side_stop_distance: 0.15
    side_warn_distance: 0.30
    range_timeout: 0.35
    require_valid_ranges: false
    escape_reverse_enabled: true
    escape_trigger_time: 1.0
    escape_reverse_duration: 2.0
    escape_reverse_speed: -0.06
    escape_cooldown: 1.5
    rear_escape_clearance: 0.25
    terrain_traversability_min: 0.20
    update_rate: 20.0
    cmd_vel_timeout: 0.3

nav_controller_node:
  ros__parameters:
    update_rate: 20.0
    cmd_vel_timeout: 0.5
    require_active_nav_goal: false
    nav_goal_status_timeout: 3.0
    nav_cmd_active_threshold: 0.02

head_mapping_lock:
  ros__parameters:
    command_topic: /head_controller/commands  # 两自由度头部位置控制器命令话题
    joint_state_topic: /joint_states  # 头部实际 yaw/pitch 反馈话题
    status_topic: /mapping/head_lock_status  # 建图头部锁定状态 JSON
    ready_topic: /mapping/head_ready  # 摄像头是否已保持正前方
    yaw_joint: head_yaw_joint  # 头部水平旋转关节名称
    pitch_joint: head_pitch_joint  # 头部俯仰关节名称
    target_yaw: 0.0  # 建图目标 yaw，单位 rad；0 表示正前方
    target_pitch: 0.0  # 建图目标 pitch，单位 rad；0 表示水平
    position_tolerance: 0.0349066  # 允许的位置误差，单位 rad，约 2°
    feedback_timeout: 0.5  # 关节反馈超时，单位 s
    require_feedback: false  # 手持固定支架时为 false，实机闭环头部应设为 true
    command_rate: 5.0  # 建图期间重复发送归中命令的频率，单位 Hz

four_wheel_odometry:
  ros__parameters:
    enabled: false  # MCU 和四轮实际转角未接入前保持关闭
    joint_state_topic: /joint_states  # MCU 桥接后的标准四轮关节状态
    output_topic: /wheel/odom  # 供 EKF 使用且不发布 TF 的轮式里程计
    status_topic: /wheel/odometry_status  # 四轮反馈完整性和超时状态
    wheelbase: 0.4  # 前后轮轴距，单位 m
    track: 0.2  # 左右轮距，单位 m
    wheel_radius: 0.05  # 轮胎有效滚动半径，单位 m
    feedback_timeout: 0.25  # 四轮状态允许的最大消息间隔，单位 s
    max_wheel_speed: 40.0  # 单轮合理最大角速度，单位 rad/s
    velocity_variance: 0.02  # vx、vy 协方差初值，单位 (m/s)^2
    yaw_rate_variance: 0.03  # yaw_rate 协方差初值，单位 (rad/s)^2
    wheel_velocity_sign: [1.0, 1.0, 1.0, 1.0]  # 左前、右前、左后、右后轮速方向符号
