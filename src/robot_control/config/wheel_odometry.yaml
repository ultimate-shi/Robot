# 使用方法：由 robot_control/launch/wheel_odometry.launch.py 加载；现场差异请通过 launch 参数覆盖。
four_wheel_odometry:
  ros__parameters:
    enabled: true  # 实机和虚拟模式均使用 ros2_control 的标准反馈
    joint_state_topic: /joint_states  # ros2_control 发布的标准关节状态
    output_topic: /wheel/odom  # 供 EKF 使用且不发布 TF 的轮式里程计
    status_topic: /wheel/odometry_status  # 四轮反馈完整性和超时状态
    wheelbase: 0.312  # 前后轮轴距，单位 m
    track: 0.280  # 左右轮距，单位 m
    wheel_radius: 0.055  # 轮胎有效滚动半径，单位 m
    leg_length: 0.060  # 主动腿长度，用于腿角引起的动态轮心 X 坐标
    feedback_timeout: 0.25  # 四轮状态允许的最大消息间隔，单位 s
    max_wheel_speed: 40.0  # 单轮合理最大角速度，单位 rad/s
    max_sync_skew: 0.10  # 转角和轮速允许的最大时间差，单位 s
    soft_residual: 0.05  # 轮间残差超过该值后开始 Huber 降权，单位 m/s
    hard_residual: 0.15  # 超过该残差标记疑似堵转、打滑或编码器异常，单位 m/s
    minimum_effective_wheels: 3  # 少于三个可信轮时停止发布轮式里程计
    irls_iterations: 5  # 鲁棒加权最小二乘最大迭代次数
    velocity_variance: 0.02  # vx、vy 协方差初值，单位 (m/s)^2
    yaw_rate_variance: 0.03  # yaw_rate 协方差初值，单位 (rad/s)^2
    wheel_velocity_sign: [1.0, 1.0, 1.0, 1.0]  # 左前、右前、左后、右后轮速方向符号
