# 使用方法：由 robot_control/launch/chassis_control.launch.py 加载；现场差异请通过 launch 参数覆盖。
chassis_controller:
  ros__parameters:
    wheelbase: 0.312
    track: 0.280
    radius: 0.055
    motion_mode: four_ws
    steering_limit: 1.57
    ackermann_min_turning_speed: 0.04
    publish_odometry: true  # 独立旧控制入口保持兼容；完整双目入口覆盖为 false，由 EKF 独占 /odom
    terrain_check_enabled: true
    cmd_vel_timeout: 0.5  # 上游速度命令超时后发布零轮速，单位 s
    steering_ready_tolerance: 0.05  # 实际转角与目标的最大偏差，单位 rad；超出时轮速为零
    steering_feedback_timeout: 0.3  # /joint_states 转向反馈最大允许年龄，单位 s

wheel_command_guard:
  ros__parameters:
    input_topic: /wheel_controller/commands_raw
    output_topic: /wheel_controller/commands
    heartbeat_topic: /hardware/command_heartbeat
    command_timeout: 0.5
    publish_rate: 20.0
    max_wheel_command_rad_s: 12.0  # 补偿后及未启用补偿时的最终轮速命令限幅，单位 rad/s
    wheel_calibration.enabled: false  # 仅在四轮正反向标定表均有效且实机验收后启用
    wheel_calibration.max_compensation_ratio: 2.0  # 补偿命令与原目标之比的上限
    # 四轮顺序与 wheel_controller 一致；命令和实测值均为正数幅值，单位 rad/s。
    # -1.0 表示尚未标定；使用浮点哨兵保持 ROS 参数数组类型明确，启用时会被校验拒绝。
    wheel_calibration.fl.forward.commands: [-1.0]
    wheel_calibration.fl.forward.measured: [-1.0]
    wheel_calibration.fl.reverse.commands: [-1.0]
    wheel_calibration.fl.reverse.measured: [-1.0]
    wheel_calibration.fr.forward.commands: [-1.0]
    wheel_calibration.fr.forward.measured: [-1.0]
    wheel_calibration.fr.reverse.commands: [-1.0]
    wheel_calibration.fr.reverse.measured: [-1.0]
    wheel_calibration.rl.forward.commands: [-1.0]
    wheel_calibration.rl.forward.measured: [-1.0]
    wheel_calibration.rl.reverse.commands: [-1.0]
    wheel_calibration.rl.reverse.measured: [-1.0]
    wheel_calibration.rr.forward.commands: [-1.0]
    wheel_calibration.rr.forward.measured: [-1.0]
    wheel_calibration.rr.reverse.commands: [-1.0]
    wheel_calibration.rr.reverse.measured: [-1.0]
