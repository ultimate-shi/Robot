; 作用：固定ESP-IDF构建工具和主从角色；用法：pio run -e master，烧录加-t upload --upload-port设备路径。
[platformio]
default_envs = master
[env]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
build_flags = -Wall -Wextra
board_build.flash_mode = dio
board_build.partitions = partitions.csv
[env:master]
build_flags = ${env.build_flags} -DARM_MASTER=1 -DARM_NODE_ID=1
[env:slave]
build_flags = ${env.build_flags} -DARM_MASTER=0 -DARM_NODE_ID=2
